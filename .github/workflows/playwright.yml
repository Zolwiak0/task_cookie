name: Cookie consent tests

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: cmd

jobs:
  cookie-consent:
    name: Cookies - ${{ matrix.browser }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install browser
        run: >
          mvn -B --no-transfer-progress exec:java
          "-Dexec.mainClass=com.microsoft.playwright.CLI"
          "-Dexec.args=install ${{ matrix.browser }}"

      - name: Run cookie consent test
        run: >
          mvn -B --no-transfer-progress test
          -Dtest=CookieConsentSimpleTest
          -Dbrowser=${{ matrix.browser }}

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: target/surefire-reports/
          if-no-files-found: ignore
